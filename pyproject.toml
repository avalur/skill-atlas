[project]
name = "skill-atlas"
version = "0.1.0"
description = "Discovery, structural validation, and static security audit for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Skill Atlas Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
skill-atlas = "skill_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_atlas"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "skill-atlas"
version = "0.2.0"
description = "Discovery, structural validation, and static security audit for AI Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Skill Atlas Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
skill-atlas = "skill_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_atlas"]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "playwright==1.60.0",
    "pillow>=10.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not network'"
markers = [
    "network: opt-in tests that call the real GitHub API",
    "slow: slow running tests",
]
